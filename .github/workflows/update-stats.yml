name: Daily Activity

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC (5 PM PHT)
    - cron: "0 13 * * *"  # 13:00 UTC (9 PM PHT)
    - cron: "0 16 * * *"  # 16:00 UTC (midnight PHT)
    - cron: "30 2 * * *"  # 02:30 UTC (10:30 AM PHT next day)
  workflow_dispatch:

jobs:
  # Job 1 — always runs: update GitHub stats
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch GitHub stats
        id: stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Authenticated calls avoid the shared-runner rate limit. -f fails the step on HTTP errors.
          api() { curl -sf -H "Authorization: Bearer $GH_TOKEN" "$@"; }

          RESPONSE=$(api https://api.github.com/users/azkriven16)
          FOLLOWERS=$(echo "$RESPONSE" | jq '.followers')
          REPOS=$(echo "$RESPONSE" | jq '.public_repos')

          if [ "$FOLLOWERS" = "null" ] || [ "$REPOS" = "null" ]; then
            echo "GitHub API returned no user data: $RESPONSE"
            exit 1
          fi

          STARS=0
          PAGE=1
          while true; do
            REPO_DATA=$(api "https://api.github.com/users/azkriven16/repos?per_page=100&page=$PAGE")
            echo "$REPO_DATA" | jq -e 'type == "array"' > /dev/null || { echo "Unexpected repo response: $REPO_DATA"; exit 1; }
            COUNT=$(echo "$REPO_DATA" | jq 'length')
            if [ "$COUNT" -eq 0 ]; then break; fi
            PAGE_STARS=$(echo "$REPO_DATA" | jq '[.[].stargazers_count] | add // 0')
            STARS=$((STARS + PAGE_STARS))
            PAGE=$((PAGE + 1))
          done

          # Contributions per calendar month, last 12 months (current month partial).
          QUERY='query($login:String!){ user(login:$login){ contributionsCollection{ contributionCalendar{ weeks{ contributionDays{ date contributionCount } } } } } }'
          BODY=$(jq -n --arg q "$QUERY" '{query: $q, variables: {login: "azkriven16"}}')
          CAL=$(api -X POST -d "$BODY" https://api.github.com/graphql)
          MONTHS=$(echo "$CAL" | jq -c '
            [.data.user.contributionsCollection.contributionCalendar.weeks[].contributionDays[]]
            | group_by(.date[:7])
            | map({month: .[0].date[:7], count: (map(.contributionCount) | add)})
            | .[-12:]')
          echo "$MONTHS" | jq -e 'type == "array" and length == 12' > /dev/null || { echo "Unexpected contributions response: $CAL"; exit 1; }

          cat > src/data/stats.json << EOF
          {
            "followers": $FOLLOWERS,
            "repos": $REPOS,
            "stars": $STARS,
            "contributions": $MONTHS,
            "updatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Commit stats if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/stats.json
          git diff --staged --quiet || git commit -m "chore: update github stats [$(date -u +%Y-%m-%d)]"
          # The checkout is the SHA the run was triggered on; main may have moved since.
          git pull --rebase origin main
          git push

  # Job 2 — runs most of the time: touch activity log so commit graph stays green.
  # Waits for job 1 so the two jobs never push to main at the same time.
  activity-ping:
    runs-on: ubuntu-latest
    needs: update-stats
    if: ${{ !cancelled() }}
    permissions:
      contents: write

    steps:
      # Skips roughly 1 in 4 runs. Actions expressions have no modulo operator,
      # so the check lives in the shell instead of a job-level `if`.
      - name: Decide whether to run
        id: gate
        run: |
          if [ $(( ${{ github.run_number }} % 4 )) -eq 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Pick a random commit message
        if: steps.gate.outputs.run == 'true'
        id: msg
        run: |
          MESSAGES=(
            "chore: minor housekeeping"
            "style: adjust spacing"
            "refactor: clean up unused vars"
            "docs: update inline notes"
            "chore: routine maintenance"
            "fix: correct edge case"
            "perf: tighten render path"
            "chore: tidy up imports"
          )
          IDX=$(( RANDOM % ${#MESSAGES[@]} ))
          echo "msg=${MESSAGES[$IDX]}" >> "$GITHUB_OUTPUT"

      - name: Touch activity log
        if: steps.gate.outputs.run == 'true'
        run: |
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> .github/activity.log

      - name: Commit activity ping
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/activity.log
          git commit -m "${{ steps.msg.outputs.msg }}"
          # Job 1 may have just pushed a stats commit that this checkout predates.
          git pull --rebase origin main
          git push
